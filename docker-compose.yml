services:
  hdg_app:
    build: .
    restart: always  # Restart the container if it fails
    network_mode: host # Use mac from host
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined  # Docker blocks AF_BLUETOOTH by default
    volumes:
      - .:/app  # Mount the project directory into the container